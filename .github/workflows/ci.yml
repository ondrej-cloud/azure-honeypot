name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "docs/data/**", "docs/charts/**", "README.md"]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
      - name: Smoke-test a demo build
        run: python -m pipeline demo --days 10

  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and lint Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
      - name: Validate cloud-init
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cloud-init > /dev/null
          cloud-init schema --config-file infra/cloud-init.yaml
      - name: Validate docker-compose.yml
        run: docker compose -f sensor/docker-compose.yml config --quiet
      - name: ShellCheck
        run: shellcheck scripts/*.sh
